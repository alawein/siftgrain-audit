[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "siftgrain-audit"
version = "0.3.1"
description = "Audit coverage of supplied evaluation records."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
siftgrain-audit = "siftgrain_audit.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "build>=1.6.1",
    "hypothesis>=6.168.5",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.8",
    "twine>=7.0.0",
    "pypi-attestations==0.0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/siftgrain_audit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: needs the network or takes more than a few seconds"]
